[package]
name = "serendip"
version = "0.1.0"
edition = "2024"

[lib]
name = "serendip"
path = "src/serendip.rs"

[[bin]]
name = "serendip"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
log = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zerocopy = "0.8"
zip = "2"
